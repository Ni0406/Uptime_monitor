---
# 1. СЕКРЕТЫ (Храним пароли безопасно)
apiVersion: v1
kind: Secret
metadata:
  name: uptime-secrets
type: Opaque
stringData:
  POSTGRES_USER: user
  POSTGRES_PASSWORD: password
  POSTGRES_DB: uptime_db
  # Обрати внимание, хост базы тут называется "db", так как мы так назовем Service ниже
  DATABASE_URL: postgresql://user:password@db:5432/uptime_db

---
# 2. ХРАНИЛИЩЕ ДЛЯ БАЗЫ (Persistent Volume Claim)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
# 3. БАЗА ДАННЫХ: Deployment и Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: postgres
        image: postgres:15
        envFrom:
        - secretRef:
            name: uptime-secrets
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: db-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: db-data
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector:
    app: db
  ports:
  - port: 5432
    targetPort: 5432

---
# 4. БЭКЕНД: Deployment и Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: uptime-backend:latest
        imagePullPolicy: Never  # Важно! Говорим Куберу брать локальный образ, а не качать из интернета
        envFrom:
        - secretRef:
            name: uptime-secrets
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
  - port: 8000
    targetPort: 8000

---
# 5. ФРОНТЕНД: Deployment и Service (LoadBalancer для доступа снаружи)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: uptime-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: LoadBalancer  # Делает сайт доступным на localhost:80
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80