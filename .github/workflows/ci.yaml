name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  # Часть 8.2: Запуск задачи на собственном раннере в Minikube
  k8s-runner-job:
    name: Test & Verify on Self-Hosted K8s Runner
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test Environment on K8s Runner
        run: |
          echo "================================================="
          echo "Running on Self-Hosted Runner inside Minikube K8s"
          echo "Node hostname: $(hostname)"
          echo "Runner OS: $(uname -a)"
          echo "================================================="

  # Часть 8.1: Сборка и публикация Docker-образа в реестр
  build-and-push:
    name: Build & Push Docker Image to GHCR
    needs: k8s-runner-job
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
